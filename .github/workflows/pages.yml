# Publie le site sur GitHub Pages.
#
# Le depot ne peut pas etre servi tel quel : GitHub Pages sert la racine de la
# branche, et le site vit dans istore-dakar/. La racine ne contient que les
# sources (catalogue.py, build-pages.py), d'ou le 404 "does not contain the
# requested file". Ce workflow publie uniquement le dossier livrable.
name: Deploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de lancer le deploiement a la main

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerer les pages depuis le catalogue
        run: |
          python -m pip install --quiet pillow
          python build-pages.py

      - name: Empecher Jekyll de traiter le site
        # Sans ce fichier, GitHub Pages fait passer le site par Jekyll, qui
        # ignore les dossiers commencant par un underscore et peut casser des
        # chemins d'assets. Le site est deja statique, il n'a rien a traiter.
        run: touch istore-dakar/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Envoyer le dossier livrable
        uses: actions/upload-pages-artifact@v3
        with:
          path: istore-dakar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
